AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  state-lookup — resolve lat/lng to US state / Canadian province (+ distance to
  the state border) via point-in-polygon over precreated binary TIGER artifacts.
  No external geocoder. Cold start reads buffers only (no GeoJSON parse).

# NOTE: API Gateway is intentionally NOT wired up yet (held off per request).
# This defines the deployable function + a boundary-data layer only. The function
# can be invoked directly, or required in-process by nomo-prospect-api
# (userController.getNearestLocations). When ready to expose over HTTP, add an
# `Events: { Api: {...} }` block to the function (or fold both resources into the
# root nomo-prospect-lambdas/template.yaml).

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 1024

Resources:
  # Precreated binary boundary artifacts ship in a versioned layer, NOT the function zip.
  # layer/geo/ contains ONLY what the runtime reads. The nodejs24.x layer build
  # relocates content under nodejs/, so these mount at /opt/nodejs/geo/ (see
  # GEO_DATA_DIR on the function):
  #   geom.f64  geom-meta.json  edges.flatbush  edges-start.u32  edges-cid.u16
  # GeoJSON build sources live in data/ (outside the layer) and are never deployed.
  StateLookupBoundariesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: state-lookup-boundaries
      ContentUri: layer/
      CompatibleRuntimes: [ nodejs22.x, nodejs24.x ]
    Metadata:
      BuildMethod: nodejs24.x

  StateLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: state-lookup
      CodeUri: src/               # index.js + binary-resolver.js + node_modules (flatbush only)
      Handler: index.handler
      MemorySize: 1024
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          # The Node layer BuildMethod relocates layer content under nodejs/, so
          # layer/geo/* deploys to /opt/nodejs/geo/* (NOT /opt/geo).
          GEO_DATA_DIR: /opt/nodejs/geo  # binary artifacts mounted from the layer
          GEO_TRUST_KM: '3'       # distance (km) under which `nearBorder` is flagged
      Layers:
        - !Ref StateLookupBoundariesLayer
      # Events:                   # <-- gateway deferred; add when exposing over HTTP
      #   GetState:
      #     Type: Api
      #     Properties: { Path: /geo/state, Method: GET }
    Metadata:
      # esbuild bundles index.js -> binary-resolver.js -> flatbush into a single
      # CJS file, inlining flatbush's ESM at build time so the runtime never
      # require()s an ES module. Geo data is untouched (ships via the layer at
      # /opt/geo; those buffers are read with fs, never require()d).
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.js
        Format: cjs
        Target: node24
        Sourcemap: false
        Minify: false

Outputs:
  FunctionArn:
    Description: state-lookup function ARN (invoke directly until a gateway is added)
    Value: !GetAtt StateLookupFunction.Arn
